<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101B2D">
<title>Offline — Selecao+</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; box-sizing: border-box; text-align: center;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #101B2D; color: #e6e9ee; }
  svg { width: 72px; height: 72px; }
  h1 { font-size: 20px; margin: 18px 0 6px; }
  p { margin: 0 0 20px; color: #9aa4b2; max-width: 300px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    padding: 11px 22px; background: #FF5A1F; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
    <rect width="64" height="64" rx="14" fill="#101B2D"/>
    <circle cx="12.5" cy="50" r="3.8" fill="#FFFFFF"/>
    <circle cx="25.5" cy="50" r="3.8" fill="#FFFFFF"/>
    <circle cx="38.5" cy="50" r="3.8" fill="#FFFFFF"/>
    <circle cx="51.5" cy="50" r="3.8" fill="#FFFFFF"/>
    <circle cx="19" cy="38.5" r="3.8" fill="#FFFFFF"/>
    <circle cx="32" cy="38.5" r="3.8" fill="#FFFFFF"/>
    <circle cx="45" cy="38.5" r="3.8" fill="#FFFFFF"/>
    <circle cx="25.5" cy="27" r="3.8" fill="#FFFFFF"/>
    <circle cx="38.5" cy="27" r="3.8" fill="#FFFFFF"/>
    <polygon points="0,-7 1.65,-2.27 6.66,-2.16 2.66,0.87 4.11,5.66 0,2.8 -4.11,5.66 -2.66,0.87 -6.66,-2.16 -1.65,-2.27" transform="translate(32 14.5) scale(1.05)" fill="#FF5A1F"/>
  </svg>
  <h1>No connection</h1>
  <p>Selecao+ needs the internet to show your team's figures. It will open as
    soon as you are back online.</p>
  <button type="button" onclick="window.location.reload()">Try again</button>
</main>
</body>
</html>
