<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101B2D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Selecao+">
<title>Sign in — Selecao+</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="brand/selecao-apple-touch-180.png">
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="stylesheet" href="app.css">
</head>
<body class="login-page">

<main class="login-card">
  <header class="chooser-head">
    <img class="logo logo-lg" src="logo.svg" alt="">
    <div>
      <h1><span class="wordmark">Selecao<span class="wordmark-plus">+</span></span></h1>
      <p class="muted">Team workload, efficiency and delivery planning</p>
    </div>
  </header>

  <form id="login-form" autocomplete="on">
    <label class="field full">
      <span>Username</span>
      <input type="text" id="username" name="username" autocomplete="username"
             spellcheck="false" autocapitalize="none" required>
    </label>
    <label class="field full">
      <span>Password</span>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>
    </label>
    <div id="login-error"></div>
    <button class="btn btn-primary btn-wide" id="btn-login" type="submit">Sign in</button>
  </form>

  <p class="muted login-note" id="login-note">
    Each account has its own units. Nobody else can see them, and nobody
    else can sign in as you.
  </p>
</main>

<script>
const form = document.getElementById('login-form');
const errors = document.getElementById('login-error');
const button = document.getElementById('btn-login');

/* If this installation has no accounts at all, say so rather than letting
   somebody guess passwords against a door with nothing behind it. */
const BASE = new URL('.', window.location.href).pathname.replace(/\/$/, '');
fetch(`${BASE}/api/auth/me`, { headers: { Accept: 'application/json' } })
  .then((r) => r.json())
  .then((data) => {
    if (data.user) { window.location.href = `${BASE}/`; return; }
    if (!data.any_accounts) {
      document.getElementById('login-note').innerHTML =
        'This installation has no accounts yet. On the machine running it: '
        + '<code>python -m workload_app.admin add &lt;username&gt; --admin</code>';
    }
  })
  .catch(() => {});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errors.replaceChildren();
  button.disabled = true;
  try {
    const response = await fetch(`${BASE}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = document.createElement('div');
      message.className = 'msg msg-bad';
      message.textContent = (data.errors || [data.error || 'Sign in failed.'])[0];
      errors.append(message);
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      return;
    }
    window.location.href = `${BASE}/`;
  } catch (error) {
    const message = document.createElement('div');
    message.className = 'msg msg-bad';
    message.textContent = 'The server could not be reached.';
    errors.append(message);
  } finally {
    button.disabled = false;
  }
});
</script>
<script src="pocket.js"></script>
</body>
</html>
