<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Selecao+</title>
<link rel="icon" type="image/svg+xml" href="brand/selecao-mark.svg">
<link rel="stylesheet" href="app.css">
</head>
<body class="login-page">

<main class="login-card">
  <header class="chooser-head">
    <span class="mark mark-lg" aria-hidden="true"><svg viewBox="0 0 64 64" focusable="false"><rect width="64" height="64" rx="14" fill="#101B2D"/><circle cx="12.5" cy="50" r="3.8" fill="#fff"/><circle cx="25.5" cy="50" r="3.8" fill="#fff"/><circle cx="38.5" cy="50" r="3.8" fill="#fff"/><circle cx="51.5" cy="50" r="3.8" fill="#fff"/><circle cx="19" cy="38.5" r="3.8" fill="#fff"/><circle cx="32" cy="38.5" r="3.8" fill="#fff"/><circle cx="45" cy="38.5" r="3.8" fill="#fff"/><circle cx="25.5" cy="27" r="3.8" fill="#fff"/><circle cx="38.5" cy="27" r="3.8" fill="#fff"/><polygon points="0,-7 1.65,-2.27 6.66,-2.16 2.66,0.87 4.11,5.66 0,2.8 -4.11,5.66 -2.66,0.87 -6.66,-2.16 -1.65,-2.27" transform="translate(32 14.5) scale(1.05)" fill="#FF5A1F"/></svg></span>
    <div>
      <h1>Selecao<span class="brand-plus">+</span></h1>
      <p class="muted">Workload, efficiency and delivery planning</p>
    </div>
  </header>

  <form id="login-form" autocomplete="on">
    <label class="field full">
      <span>Username</span>
      <input type="text" id="username" name="username" autocomplete="username"
             spellcheck="false" autocapitalize="none" required>
    </label>
    <label class="field full">
      <span>Password</span>
      <input type="password" id="password" name="password"
             autocomplete="current-password" required>
    </label>
    <div id="login-error"></div>
    <button class="btn btn-primary btn-wide" id="btn-login" type="submit">Sign in</button>
  </form>

  <p class="muted login-note" id="login-note">
    Each account has its own workbooks. Nobody else can see them, and nobody
    else can sign in as you.
  </p>
</main>

<script>
const form = document.getElementById('login-form');
const errors = document.getElementById('login-error');
const button = document.getElementById('btn-login');

/* If this installation has no accounts at all, say so rather than letting
   somebody guess passwords against a door with nothing behind it. */
const BASE = new URL('.', window.location.href).pathname.replace(/\/$/, '');
fetch(`${BASE}/api/auth/me`, { headers: { Accept: 'application/json' } })
  .then((r) => r.json())
  .then((data) => {
    if (data.user) { window.location.href = `${BASE}/`; return; }
    if (!data.any_accounts) {
      document.getElementById('login-note').innerHTML =
        'This installation has no accounts yet. On the machine running it: '
        + '<code>python -m workload_app.admin add &lt;username&gt; --admin</code>';
    }
  })
  .catch(() => {});

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  errors.replaceChildren();
  button.disabled = true;
  try {
    const response = await fetch(`${BASE}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = document.createElement('div');
      message.className = 'msg msg-bad';
      message.textContent = (data.errors || [data.error || 'Sign in failed.'])[0];
      errors.append(message);
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      return;
    }
    window.location.href = `${BASE}/`;
  } catch (error) {
    const message = document.createElement('div');
    message.className = 'msg msg-bad';
    message.textContent = 'The server could not be reached.';
    errors.append(message);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
